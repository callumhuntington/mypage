<!-- Every path below is relative, exactly as on the other three pages, so this
     file behaves like its siblings and opens correctly from the Desktop.

     The complication is that GitHub Pages serves this one file for ANY unknown
     address. At /typo it is a sibling of index.html and relative paths are
     right; at /some/deep/typo/ they would resolve against that address and the
     stylesheet, the fonts and all three nav links would 404 in turn. A <base>
     pins them to the site root and fixes both cases at once — but it cannot be
     hard-coded, because on file:// a root of / is the top of the hard disk,
     which is what left this page unstyled the first time round. So it is added
     only when the page is actually being served over http(s).

     This runs before the parser reaches the <link> tags below, which is the
     whole point: a base inserted afterwards would not apply to them. -->
<script>
  if (location.protocol !== 'file:') {
    document.head.insertAdjacentHTML('afterbegin', '<base href="/">');
  }
</script>
